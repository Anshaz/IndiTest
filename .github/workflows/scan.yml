name: Daily confluence scan

on:
  schedule:
    # 21:15 UTC ≈ 4:15pm ET (EST). During US daylight saving time (EDT, UTC-4)
    # this lands at 5:15pm ET instead of 4:15pm — still after close either
    # way, just adjust the hour below if you want it tighter to the bell.
    - cron: '15 21 * * 1-5' # weekdays only
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # paced single-symbol fetching + occasional 65s retries takes a few minutes now, not seconds — this just catches a genuinely stuck run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scripts/scan.mjs

      - name: Commit updated results
        run: |
          git config user.name "confluence-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.jsonl data/history/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
